name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Install base tools (git, curl, tar/zstd)
        shell: sh
        run: |
          set -eu
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git openssh-client curl tar zstd ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore caches (buildx)
        uses: actions/cache@v4
        with:
          path: |
            .buildx-cache
          key: ${{ runner.os }}-exist-fdsn-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-exist-fdsn-

      - name: Build Docker image (with buildx cache when available)
        shell: sh
        run: |
          set -eu
          mkdir -p .buildx-cache
          if docker buildx version >/dev/null 2>&1; then
            docker buildx create --name ci-builder --use >/dev/null 2>&1 || docker buildx use ci-builder
            docker buildx build --load -t exist-fdsn-station \
              --cache-from type=local,src=.buildx-cache \
              --cache-to type=local,dest=.buildx-cache-new,mode=max \
              .
            rm -rf .buildx-cache
            mv .buildx-cache-new .buildx-cache
          else
            docker build --rm . -t exist-fdsn-station
          fi

      - name: Start container
        shell: sh
        run: |
          set -eu
          docker rm -f exist-fdsn-station >/dev/null 2>&1 || true
          docker run -d -p 8080:8080 --name exist-fdsn-station exist-fdsn-station

      - name: Install test dependencies
        shell: sh
        run: |
          set -eu
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential libxml2-dev libxslt1-dev zlib1g-dev python3-dev pkg-config
          python3 -m pip install --upgrade pip setuptools wheel --disable-pip-version-check
          python3 -m pip install --user --no-cache-dir pytest==7.1.2 lxml xmldiff requests
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Wait for service to respond (up to 120s)
        shell: sh
        run: |
          set -eu
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)"
            [ "$code" != "000" ] && exit 0 || true
            sleep 1
          done
          echo "Service did not start in time" >&2
          docker logs exist-fdsn-station || true
          exit 1

      - name: Run tests
        shell: sh
        run: |
          set -eu
          pytest -vv TEST/test.py --host localhost:8080 -k 'not test_management'
          pytest -vv TEST/test.py --host localhost:8080 -k 'test_management'

      - name: Teardown
        if: always()
        shell: sh
        run: |
          docker rm -f exist-fdsn-station || true
