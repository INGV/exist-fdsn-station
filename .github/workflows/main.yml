name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""

    env:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: tcp://docker:2375

    steps:
      - name: Install base tools (git, curl, tar/zstd)
        shell: sh
        run: |
          set -eu
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git openssh-client curl tar zstd ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore caches (buildx)
        uses: actions/cache@v4
        with:
          path: |
            .buildx-cache
          key: ${{ runner.os }}-exist-fdsn-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-exist-fdsn-

      - name: Wait for Docker daemon (dind) to be ready
        shell: sh
        run: |
          set -eu
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Docker daemon did not become ready in time" >&2
          docker version || true
          exit 1

      - name: Build Docker image (with buildx cache when available)
        shell: sh
        run: |
          set -eu
          mkdir -p .buildx-cache
          if docker buildx version >/dev/null 2>&1; then
            docker buildx create --name ci-builder --use >/dev/null 2>&1 || docker buildx use ci-builder
            docker buildx build --load -t exist-fdsn-station \
              --cache-from type=local,src=.buildx-cache \
              --cache-to type=local,dest=.buildx-cache-new,mode=max \
              .
            rm -rf .buildx-cache
            mv .buildx-cache-new .buildx-cache
          else
            docker build --rm . -t exist-fdsn-station
          fi

      - name: Start container
        shell: sh
        run: |
          set -eu
          docker rm -f exist-fdsn-station >/dev/null 2>&1 || true
          docker run -d -p 80:8080/tcp --name exist-fdsn-station exist-fdsn-station

      - name: Install test dependencies
        shell: sh
        run: |
          set -eu
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip build-essential libxml2-dev libxslt1-dev python3-dev
          # Use the python -m pip --user pattern to avoid modifying system-wide packages.
          python3 -m pip install --upgrade pip --disable-pip-version-check
          python3 -
